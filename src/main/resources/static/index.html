<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VacationMax</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url("paradise.jpg");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            background-repeat: no-repeat;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.affordable {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .result.tight {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }

        .result.not-affordable {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .result h2 {
            margin-bottom: 15px;
        }

        .result p {
            margin: 8px 0;
            font-size: 16px;
        }

        .error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <h1> Welcome to VacationMax</h1>
    <p class="subtitle">Plan the trip of your dreams without having to worry about calculations!</p>

    <form id="vacationForm">
        <div class="form-group">
            <label for="days">Number of Days:</label>
            <input type="number" id="days" min="1" required>
        </div>

        <div class="form-group">
            <label for="budget">Total Budget (Any Currency):</label>
            <input type="number" id="budget" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="flightCost">Flight Cost (Any Currency):</label>
            <input type="number" id="flightCost" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="nightCost">Hotel Cost (Any Currency) :</label>
            <input type="number" id="nightCost" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="foodCost">Food Cost (Any Currency) :</label>
            <input type="number" id="foodCost" step="0.01" min="0" value="0">
        </div>

        <div class="form-group">
            <label for="activitiesCost">Activities Cost (Any Currency) :</label>
            <input type="number" id="activitiesCost" step="0.01" min="0" value="0">
        </div>

        <div class="form-group">
            <label for="transportCost">Transport Cost (Any Currency) :</label>
            <input type="number" id="transportCost" step="0.01" min="0" value="0">
        </div>

        <div class="form-group">
            <label for="emergencyMoney">Emergency Fund (Any Currency):</label>
            <input type="number" id="emergencyMoney" step="0.01" min="0" value="0">
        </div>

        <button type="submit">Calculate Budget</button>
    </form>

    <div id="error" class="error"></div>

    <div id="result" class="result">
        <h2 id="statusTitle"></h2>
        <p><strong>Total Cost:</strong> $<span id="totalCost"></span></p>
        <p><strong>Budget Gap:</strong> $<span id="budgetGap"></span></p>
        <p id="statusMessage"></p>
    </div>
</div>

<script>
    document.getElementById('vacationForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
            days: parseInt(document.getElementById('days').value),
            budget: parseFloat(document.getElementById('budget').value),
            flightCost: parseFloat(document.getElementById('flightCost').value),
            nightCost: parseFloat(document.getElementById('nightCost').value),
            foodCost: parseFloat(document.getElementById('foodCost').value) || 0,
            activitiesCost: parseFloat(document.getElementById('activitiesCost').value) || 0,
            transportCost: parseFloat(document.getElementById('transportCost').value) || 0,
            emergencyMoney: parseFloat(document.getElementById('emergencyMoney').value) || 0
        };

        try {
            const response = await fetch('/vacation', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            if (!response.ok) {
                throw new Error('Failed to calculate budget');
            }

            const data = await response.json();
            displayResult(data);

        } catch (error) {
            showError(error.message);
        }
    });

    function displayResult(data) {
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');

        errorDiv.classList.remove('show');

        document.getElementById('totalCost').textContent = data.totalCost.toFixed(2);
        document.getElementById('budgetGap').textContent = data.budgetGap.toFixed(2);

        resultDiv.className = 'result show';

        if (data.vacationStatus === 'AFFORDABLE') {
            resultDiv.classList.add('affordable');
            document.getElementById('statusTitle').textContent = '✅ Your Vacation is Affordable!';
            document.getElementById('statusMessage').textContent = 'Perfect! You have enough to plan your trip, enjoy';
        } else if (data.vacationStatus === 'TIGHT') {
            resultDiv.classList.add('tight');
            document.getElementById('statusTitle').textContent = '⚠️ Budget is Tight';
            document.getElementById('statusMessage').textContent = 'You are slighty above you budget... Maybe Consider adjusting some expenses.';
        } else {
            resultDiv.classList.add('not-affordable');
            document.getElementById('statusTitle').textContent = '❌ Not Affordable';
            document.getElementById('statusMessage').textContent = 'Sadly, your budget is not enough for this trip. You need to increase your budget or reduce costs.';
        }
    }

    function showError(message) {
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');

        resultDiv.classList.remove('show');
        errorDiv.textContent = '❌ Error: ' + message;
        errorDiv.classList.add('show');
    }
</script>
</body>
</html>
